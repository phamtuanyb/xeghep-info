name: Deploy VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.APP_DIR || '/var/www/xeghep' }}"
            export DEPLOY_BRANCH="${{ secrets.DEPLOY_BRANCH || 'master' }}"
            export REPO_URL="${{ secrets.REPO_URL }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -z "$REPO_URL" ]; then
                echo "REPO_URL secret is required for first deploy."
                exit 1
              fi
              mkdir -p "$APP_DIR"
              git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" "$APP_DIR"
            fi
            bash "$APP_DIR/deploy/vps-deploy.sh"
